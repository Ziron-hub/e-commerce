services:
  # Banco de dados PostgreSQL
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
      POSTGRES_DB: ecommerce
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init_user_service.sql:/docker-entrypoint-initdb.d/01_init_user_service.sql
      - ./infra/postgres/init_cart_service.sql:/docker-entrypoint-initdb.d/02_init_cart_service.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Kafka em KRaft mode 
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    environment:
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5


  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/grafana-tempo/tempo.yaml:/etc/tempo.yaml
    ports:
      - "3200:3200"   # UI

  # Grafana Mimir (metrics)
  mimir:
    image: grafana/mimir:latest
    command: ["-config.file=/etc/mimir.yaml"]
    volumes:
      - ./infra/grafana-mimir/mimir.yaml:/etc/mimir.yaml
    ports:
      - "9009:9009"

  # Grafana Loki (logs)
  loki:
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/log:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infra/promtail/promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/open-telemetry/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    # ports:
      # - "4317:4317"   # gRPC
      # - "4318:4318"   # HTTP
    depends_on:
      - tempo
      - mimir
      - loki

  # Grafana (dashboards)
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - tempo
      - mimir
      - loki

  # Nginx como proxy reverso
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:80"  
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - users-service
      - cart-service

  cart-service:
    build:
      context: ./services/cart-service
      dockerfile: src/main/docker/Dockerfile.jvm
    container_name: cart-service
    ports:
      - "8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/ecommerce
      QUARKUS_DATASOURCE_USERNAME: ecommerce
      QUARKUS_DATASOURCE_PASSWORD: ecommerce
      QUARKUS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      QUARKUS_OPENTELEMETRY_TRACER_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      QUARKUS_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4317
    depends_on:
          postgres:
            condition: service_healthy
          otel-collector:
            condition: service_started
          kafka:
            condition: service_healthy

  users-service:
      build:
        context: ./services/users-service
        dockerfile: src/main/docker/Dockerfile.jvm
      container_name: users-service
      ports:
        - "8080"
      environment:
        QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/ecommerce
        QUARKUS_DATASOURCE_USERNAME: ecommerce
        QUARKUS_DATASOURCE_PASSWORD: ecommerce
        QUARKUS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
        QUARKUS_OPENTELEMETRY_TRACER_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
        QUARKUS_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4317
      depends_on:
            postgres:
              condition: service_healthy
            otel-collector:
              condition: service_started
            kafka:
              condition: service_healthy


volumes:
  postgres_data:
  kafka_data:
